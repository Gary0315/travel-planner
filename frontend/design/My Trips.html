<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roamie · 我的行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Quicksand:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.95 0.03 75); }
  body { font-family: "Quicksand", "Noto Sans TC", ui-rounded, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  .toggle { position: fixed; top: 14px; right: 14px; z-index: 50; background: white; border: 2px solid oklch(0.22 0.03 50); border-radius: 999px; padding: 6px; display: inline-flex; gap: 4px; box-shadow: 3px 3px 0 oklch(0.22 0.03 50); }
  .toggle button { padding: 6px 14px; font-size: 12px; font-weight: 700; border-radius: 999px; border: none; background: transparent; color: oklch(0.22 0.03 50); cursor: pointer; }
  .toggle button.active { background: oklch(0.22 0.03 50); color: white; }
  .stage { display: flex; justify-content: center; padding: 40px 20px; }
  .stage.mobile { padding: 20px; }
  .frame-desktop { width: 1280px; max-width: 100%; background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
  .frame-mobile { width: 390px; background: white; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.12); border: 8px solid #111; min-height: 760px; position: relative; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="my-trips.jsx"></script>
<script type="text/babel" data-presets="env,react">
  const { useState } = React;
  function App() {
    const [view, setView] = useState('desktop');
    return (
      <div>
        <div className="toggle">
          <button className={view==='desktop'?'active':''} onClick={()=>setView('desktop')}>🖥 Desktop</button>
          <button className={view==='mobile'?'active':''} onClick={()=>setView('mobile')}>📱 Mobile</button>
        </div>
        <div className={'stage ' + view}>
          <div className={view==='mobile'?'frame-mobile':'frame-desktop'}>
            <window.MyTrips mobile={view==='mobile'} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
